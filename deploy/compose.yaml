# Fettle in server mode with PostgreSQL and MinIO (§17). Fettle creates its bucket.
#
#   FETTLE_MASTER_KEY=$(openssl rand -base64 32) docker compose -f deploy/compose.yaml up -d
#
# Keep FETTLE_MASTER_KEY: it opens the vault. Create the first account with
#   docker compose -f deploy/compose.yaml exec fettle fettle admin create-user --email you@example.com --name You --admin
#
# PostgreSQL and MinIO are optional: without them, remove their services and the
# FETTLE_DB and FETTLE_S3_* lines; Fettle then keeps SQLite and files in the data volume.

name: fettle

services:
  fettle:
    image: ${FETTLE_IMAGE:-ghcr.io/alternayte/fettle:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      FETTLE_MODE: server
      FETTLE_BASE_URL: ${FETTLE_BASE_URL:-http://localhost:7420}
      FETTLE_MASTER_KEY: ${FETTLE_MASTER_KEY:?set FETTLE_MASTER_KEY, for example with openssl rand -base64 32}
      FETTLE_DB: postgres://fettle:${POSTGRES_PASSWORD:-fettle}@postgres:5432/fettle?sslmode=disable
      FETTLE_OBJECT_STORE: s3
      FETTLE_S3_ENDPOINT: http://minio:9000
      FETTLE_S3_REGION: us-east-1
      FETTLE_S3_BUCKET: fettle
      FETTLE_S3_ACCESS_KEY: fettle
      FETTLE_S3_SECRET_KEY: ${MINIO_PASSWORD:-fettle-minio-secret}
      FETTLE_S3_PATH_STYLE: "true"
    ports:
      - "${FETTLE_PORT:-7420}:7420"
    volumes:
      - fettle-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fettle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fettle}
      POSTGRES_DB: fettle
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fettle -d fettle"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: fettle
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-fettle-minio-secret}
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  fettle-data:
  postgres-data:
  minio-data:
