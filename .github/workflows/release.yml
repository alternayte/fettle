# The release pipeline (§17). A tag v* builds the binaries, the server and computer images
# (amd64 and arm64), the E2B template definition and the checksums with goreleaser, the
# desktop installers on each OS, and the signed update feed of the desktop app. Before a
# person publishes the draft, computer-check starts a computer from the Linux release binary,
# and the macOS and Windows jobs check that the image their app names is public on ghcr.io.
#
# Secrets: MACOS_CERTIFICATE (base64 .p12), MACOS_CERTIFICATE_PASSWORD, MACOS_SIGN_IDENTITY,
# APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (notarization), WINDOWS_CERTIFICATE (base64
# .pfx), WINDOWS_CERTIFICATE_PASSWORD, FETTLE_UPDATE_SIGNING_KEY and the variable
# FETTLE_UPDATE_PUBLIC_KEY (tools/updatefeed -keygen). Without a secret its step signs
# nothing; the artifacts still build.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop-macos:
    needs: goreleaser
    runs-on: macos-15
    env:
      HAS_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: cd ui && bun install --frozen-lockfile && bun run build
      - name: Import the signing certificate
        if: env.HAS_CERT == 'true'
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$CERT" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12
      - name: Build and package
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          FETTLE_UPDATE_PUBLIC_KEY: ${{ vars.FETTLE_UPDATE_PUBLIC_KEY }}
        run: desktop/macos/package.sh "${GITHUB_REF_NAME#v}" out
      - name: Check the computer image of the app
        run: |
          mkdir -p "$RUNNER_TEMP/app"
          tar -xzf "out/Fettle-${GITHUB_REF_NAME#v}-darwin-universal.tar.gz" -C "$RUNNER_TEMP/app"
          img=$("$RUNNER_TEMP/app/Fettle.app/Contents/MacOS/fettle-desktop" --computer-image)
          test "$img" = "ghcr.io/alternayte/fettle-computer:${GITHUB_REF_NAME#v}"
          scripts/check-image.sh "$img"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: out/*

  desktop-windows:
    needs: goreleaser
    runs-on: windows-2022
    env:
      HAS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - shell: bash
        run: cd ui && bun install --frozen-lockfile && bun run build
      - shell: bash
        env:
          FETTLE_UPDATE_PUBLIC_KEY: ${{ vars.FETTLE_UPDATE_PUBLIC_KEY }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          go build -tags desktop -trimpath -ldflags "-s -w -H windowsgui -X main.version=$v -X main.computerImage=ghcr.io/alternayte/fettle-computer:$v -X main.updateKey=$FETTLE_UPDATE_PUBLIC_KEY" -o Fettle.exe ./cmd/fettle-desktop
          dotnet tool install --global wix --version 4.0.5
          wix build desktop/windows/fettle.wxs -d Version="$v" -d Exe=Fettle.exe -o "Fettle-$v-windows-amd64.msi"
          mkdir out && cp Fettle.exe "out/Fettle-$v-windows-amd64.exe" && mv "Fettle-$v-windows-amd64.msi" out/
      - name: Check the computer image of the app
        shell: bash
        run: |
          ./Fettle.exe --computer-image > image.txt
          img=$(tr -d '\r' < image.txt)
          test "$img" = "ghcr.io/alternayte/fettle-computer:${GITHUB_REF_NAME#v}"
          scripts/check-image.sh "$img"
      - name: Sign
        if: env.HAS_CERT == 'true'
        shell: pwsh
        env:
          CERT: ${{ secrets.WINDOWS_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:CERT))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          Get-ChildItem out\* | ForEach-Object { & $signtool.FullName sign /f cert.pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName }
          Remove-Item cert.pfx
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: out/*

  desktop-linux:
    needs: goreleaser
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libfuse2
      - run: cd ui && bun install --frozen-lockfile && bun run build
      - env:
          FETTLE_UPDATE_PUBLIC_KEY: ${{ vars.FETTLE_UPDATE_PUBLIC_KEY }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          CGO_ENABLED=1 go build -tags desktop -trimpath -ldflags "-s -w -X main.version=$v -X main.computerImage=ghcr.io/alternayte/fettle-computer:$v -X main.updateKey=$FETTLE_UPDATE_PUBLIC_KEY" -o fettle-desktop ./cmd/fettle-desktop
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0
          curl -fsSLo appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-$(uname -m).AppImage"
          chmod +x appimagetool && sudo mv appimagetool /usr/local/bin/
          mkdir -p out
          desktop/linux/appimage.sh fettle-desktop "$v" out
          VERSION="$v" ARCH="${{ matrix.arch }}" nfpm package --config desktop/linux/nfpm.yaml --packager deb --target out/
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-${{ matrix.arch }}
          path: out/*

  # Starts one computer from the Linux release binary with the docker provider, without a
  # registry login, so a missing or private image fails the release before it is published.
  computer-check:
    needs: goreleaser
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download the Linux release binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern fettle_linux_amd64.tar.gz --dir dist
          tar -xzf dist/fettle_linux_amd64.tar.gz -C dist fettle
      - name: Start a computer and run a command in it
        env:
          FETTLE_DEFAULT_PROVIDER: docker
        run: |
          docker logout ghcr.io || true
          export FETTLE_DATA="$RUNNER_TEMP/fettle"
          test "$(dist/fettle version --image)" = "ghcr.io/alternayte/fettle-computer:${GITHUB_REF_NAME#v}"
          dist/fettle up
          trap 'dist/fettle down' EXIT
          dist/fettle computer add docker
          dist/fettle computer test

  publish-desktop:
    needs: [desktop-macos, desktop-windows, desktop-linux, computer-check]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Write the update feed and the checksums
        env:
          FETTLE_UPDATE_SIGNING_KEY: ${{ secrets.FETTLE_UPDATE_SIGNING_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          if [ -n "$FETTLE_UPDATE_SIGNING_KEY" ]; then
            go run ./tools/updatefeed -version "$v" -base "$base" -out out/update.json \
              "darwin-arm64=out/Fettle-$v-darwin-universal.tar.gz" "darwin-amd64=out/Fettle-$v-darwin-universal.tar.gz" \
              "windows-amd64=out/Fettle-$v-windows-amd64.exe" \
              "linux-amd64=out/Fettle-$v-linux-x86_64.AppImage" "linux-arm64=out/Fettle-$v-linux-aarch64.AppImage"
          fi
          (cd out && sha256sum -- * > SHA256SUMS-desktop)
          gh release upload "$GITHUB_REF_NAME" out/* --clobber
