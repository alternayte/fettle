# The .deb of the desktop app (§17). Build ./fettle-desktop first, then run from the repository root:
# VERSION=1.0.0 ARCH=amd64 nfpm package --config desktop/linux/nfpm.yaml --packager deb
name: fettle-desktop
arch: ${ARCH}
version: ${VERSION}
maintainer: Fettle maintainers <alternayte@users.noreply.github.com>
description: Fettle desktop app. Your AI team, on your computer or a server.
license: AGPL-3.0-only
homepage: https://github.com/alternayte/fettle
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4
contents:
  - src: fettle-desktop
    dst: /usr/bin/fettle-desktop
    file_info:
      mode: 0755
  - src: desktop/linux/fettle.desktop
    dst: /usr/share/applications/fettle.desktop
  - src: desktop/linux/fettle.png
    dst: /usr/share/icons/hicolor/256x256/apps/fettle.png
